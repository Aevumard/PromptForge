name: PromptForge CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python
        run: python -m compileall -q harness tests
      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Install package
        run: python -m pip install . --no-deps
      - name: Package smoke test
        run: python -c "from promptforge import prepare_context; r = prepare_context({'entity': 'A-17', 'noise': 'x'}, ['entity']); assert r['context'] == {'entity': 'A-17'}"
