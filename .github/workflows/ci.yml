name: PromptForge CI

on:
  push:
    branches: [main, "feature/**", "benchmark/**"]
  pull_request:
    branches: [main, "feature/**", "benchmark/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python
        run: python -m compileall -q harness promptforge tests
      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Public import boundary audit
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          for path in sorted(Path("promptforge").glob("*.py")):
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      names = [alias.name for alias in node.names]
                  elif isinstance(node, ast.ImportFrom):
                      names = [node.module or ""]
                  else:
                      continue
                  assert all(not name == "harness" and not name.startswith("harness.") for name in names), path
          PY
      - name: Install package
        run: python -m pip install . --no-deps
      - name: Installed package isolation
        run: |
          cd /tmp
          python -c 'import importlib.util, sys; from promptforge import prepare_context; r = prepare_context({"entity": "A-17", "noise": "x"}, ["entity"]); assert r["context"] == {"entity": "A-17"}; assert importlib.util.find_spec("harness") is None'
      - name: Package smoke test
        run: |
          python -c 'import sys; sys.path.pop(0); from promptforge import prepare_context, __version__; r = prepare_context({"entity": "A-17", "noise": "x"}, ["entity"]); assert r["context"] == {"entity": "A-17"}; assert __version__ == "0.1.0"'
