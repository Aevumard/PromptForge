name: V22 Hashes
on:
  push:
    branches:
      - feature/v22-action-evidence-anchor

jobs:
  hashes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print SHA-256
        run: |
          sha256sum AGENTS.md README.md promptforge/decision.py tests/test_decision.py
