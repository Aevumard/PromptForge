name: V26 hash probe

on:
  pull_request:
    branches: [main]

jobs:
  hashes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Hash changed public files
        run: |
          sha256sum AGENTS.md README.md promptforge/decision.py tests/test_decision.py
